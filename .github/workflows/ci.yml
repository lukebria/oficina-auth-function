name: "Auth Function - CI"

# Roda em PRs para homolog/master (git flow do projeto: feat -> homolog -> master).
# Só valida codigo (typecheck + testes) - nao toca em infra nem precisa de credenciais AWS.
on:
  pull_request:
    branches:
      - homolog
      - master

jobs:
  test:
    name: "Typecheck & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
